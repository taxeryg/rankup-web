<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | RankUpTogether</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .error-container {
      max-width: 500px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      margin-bottom: 16px;
    }

    p {
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Lost in the Lobby?</h1>
    <p>The page you're looking for doesn't exist or has been moved. Don't worry, your rank is still safe!</p>
    <a href="/" class="btn-primary" style="display:inline-flex; justify-content:center;">Return to Home Base</a>
  </div>
</body>

</html>
